<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Τρίλιζα Online v3.0</title>
    <script src="https://cdn.ably.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .setup-box { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-top: 20px; display: none; }
        .cell { width: 100px; height: 100px; background: #fff; border: 2px solid #333; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; color: #d9534f; }
        input { padding: 10px; margin-bottom: 10px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="setup-box" id="setup">
        <h2>🎮 Είσοδος στο Παιχνίδι</h2>
        <input type="text" id="roomInput" placeholder="Όνομα Δωματίου">
        <br>
        <button onclick="startApp()">Σύνδεση & Έναρξη</button>
    </div>

    <div id="status"></div>

    <div class="board" id="board">
        <div class="cell" onclick="sendMove(0)"></div>
        <div class="cell" onclick="sendMove(1)"></div>
        <div class="cell" onclick="sendMove(2)"></div>
        <div class="cell" onclick="sendMove(3)"></div>
        <div class="cell" onclick="sendMove(4)"></div>
        <div class="cell" onclick="sendMove(5)"></div>
        <div class="cell" onclick="sendMove(6)"></div>
        <div class="cell" onclick="sendMove(7)"></div>
        <div class="cell" onclick="sendMove(8)"></div>
    </div>

    <script>
        // ΑΝ ΔΕΝ ΔΟΥΛΕΥΕΙ, ΦΤΙΑΞΕ ΕΝΑ ΝΕΟ KEY ΣΤΟ ABLY.COM
        const ABLY_KEY = 'lvPZVg.F1b5GQ:VsS4kw48H7emnvy3udA7PmfmEuLU4UjLU24wi_kZt8M';
        let ably, channel, mySymbol = null, currentPlayer = 'X', boardState = Array(9).fill(null);

        function startApp() {
            const room = document.getElementById('roomInput').value.trim();
            if (!room) return alert("Δώσε όνομα δωματίου!");

            document.getElementById('status').innerText = "Προσπάθεια σύνδεσης...";

            // Αρχικοποίηση Ably με έλεγχο σφαλμάτων
            ably = new Ably.Realtime({ key: ABLY_KEY });

            ably.connection.on('connected', () => {
                console.log("Connected to Ably!");
                document.getElementById('status').innerText = "Συνδέθηκε! Περιμένω κίνηση...";
                document.getElementById('setup').style.display = 'none';
                document.getElementById('board').style.display = 'grid';
                
                channel = ably.channels.get(room);
                
                channel.subscribe('move', (msg) => {
                    const { index, symbol } = msg.data;
                    renderMove(index, symbol);
                });
            });

            ably.connection.on('failed', (err) => {
                document.getElementById('status').innerText = "ΑΠΟΤΥΧΙΑ: " + err.message;
                console.error("Connection failed:", err);
            });
        }

        function sendMove(index) {
            if (boardState[index] || (mySymbol && mySymbol !== currentPlayer)) return;
            if (!mySymbol) mySymbol = currentPlayer;
            channel.publish('move', { index, symbol: currentPlayer });
        }

        function renderMove(index, symbol) {
            const cells = document.querySelectorAll('.cell');
            cells[index].innerText = symbol;
            boardState[index] = symbol;
            currentPlayer = (symbol === 'X') ? 'O' : 'X';
            document.getElementById('status').innerText = `Σειρά του: ${currentPlayer} (Είσαι: ${mySymbol || '?'})`;
            checkWinner();
        }

        function checkWinner() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let [a, b, c] of wins) {
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    document.getElementById('status').innerText = "🎉 ΝΙΚΗΤΗΣ: " + boardState[a];
                    document.getElementById('board').style.pointerEvents = 'none';
                }
            }
        }
    </script>
</body>
</html>
