<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>P2P Τρίλιζα Online</title>
    <script src="https://unpkg.com"></script>
    <style>
        :root { --bg: #0f172a; --x: #f43f5e; --o: #38bdf8; --text: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; margin: 20px; }
        .cell { width: 90px; height: 90px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; font-size: 2.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cell.x { color: var(--x); } .cell.o { color: var(--o); }
        .setup { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; display: inline-block; margin-bottom: 20px; }
        #debug { color: #f43f5e; font-size: 0.8rem; margin-top: 10px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--o); color: #0f172a; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Τρίλιζα <span style="color:var(--o)">Online</span></h1>

    <div class="setup">
        <div>Your ID: <strong id="my-id" style="color:var(--o)">...</strong></div>
        <div id="debug">Initializing connection...</div>
        <br>
        <input type="text" id="peer-id" placeholder="ID Φίλου" style="padding: 8px; border-radius: 5px;">
        <button onclick="connectToFriend()">Σύνδεση</button>
    </div>

    <div id="status">Περιμένω...</div>

    <div class="board">
        <div class="cell" onclick="tap(0)" id="c0"></div>
        <div class="cell" onclick="tap(1)" id="c1"></div>
        <div class="cell" onclick="tap(2)" id="c2"></div>
        <div class="cell" onclick="tap(3)" id="c3"></div>
        <div class="cell" onclick="tap(4)" id="c4"></div>
        <div class="cell" onclick="tap(5)" id="c5"></div>
        <div class="cell" onclick="tap(6)" id="c6"></div>
        <div class="cell" onclick="tap(7)" id="c7"></div>
        <div class="cell" onclick="tap(8)" id="c8"></div>
    </div>

    <script>
        // Start Peer with automatic ID generation
        const peer = new Peer({
            debug: 2,
            config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
        });

        let conn, me, turn = 'X', boardState = Array(9).fill(null);

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('debug').innerText = "Network connected! Ready.";
            document.getElementById('status').innerText = "Share ID or connect to join.";
        });

        peer.on('error', err => {
            document.getElementById('debug').innerText = "Error: " + err.type;
            console.error(err);
        });

        peer.on('connection', c => {
            conn = c; me = 'X'; init();
            document.getElementById('status').innerText = "Συνδέθηκε! Είσαι ο Χ";
        });

        function connectToFriend() {
            const id = document.getElementById('peer-id').value;
            if(!id) return;
            conn = peer.connect(id);
            me = 'O'; init();
            document.getElementById('status').innerText = "Συνδέεται...";
        }

        function init() {
            conn.on('data', d => update(d.i, d.s));
            conn.on('open', () => { if(me==='O') document.getElementById('status').innerText = "Συνδέθηκε! Περίμενε τον X..."; });
        }

        function tap(i) {
            if (!conn || boardState[i] || turn !== me) return;
            update(i, me);
            conn.send({ i: i, s: me });
        }

        function update(i, s) {
            boardState[i] = s;
            document.getElementById('c' + i).innerText = s;
            document.getElementById('c' + i).className = 'cell ' + s.toLowerCase();
            turn = (s === 'X') ? 'O' : 'X';
            check();
        }

        function check() {
            const wins = [
                [0,1,2],[3,4,5],[6,7,8],[0,3,6],
                [1,4,7],[2,5,8],[0,4,8],[2,4,6]
            ];
            for (let [a,b,c] of wins) {
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    document.getElementById('status').innerText = "Νικητής: " + boardState[a] + "! 🎉";
                    conn = null; return;
                }
            }
            if (!boardState.includes(null)) document.getElementById('status').innerText = "Ισοπαλία! 🤝";
            else document.getElementById('status').innerText = (turn === me ? "Σειρά σου!" : "Περίμενε...");
        }
    </script>
</body>
</html>
