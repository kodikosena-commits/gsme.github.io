<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ably Tic-Tac-Toe v5.0</title>
    
    <!-- Εναλλακτική πηγή βιβλιοθήκης από Cloudflare που δεν μπλοκάρεται εύκολα -->
    <script src="https://cdnjs.cloudflare.com"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #eef2f3; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        #setup { margin-bottom: 20px; }
        input { padding: 12px; border: 2px solid #ddd; border-radius: 8px; width: 80%; margin-bottom: 10px; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; display: none; }
        .cell { aspect-ratio: 1/1; background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 12px; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; color: #007bff; min-height: 24px; padding: 10px; }
        .error { color: #dc3545 !important; background: #f8d7da; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Online Τρίλιζα</h1>
    <p style="font-size: 0.8rem; color: #888;">Version 5.0 (Cloudflare Lib)</p>

    <div id="setup">
        <input type="text" id="roomInput" placeholder="Όνομα δωματίου">
        <br>
        <button onclick="startApp()">Σύνδεση & Έναρξη</button>
    </div>

    <div id="status">Περιμένω είσοδο...</div>

    <div class="board" id="gameBoard">
        <div class="cell" onclick="handleCellClick(0)"></div>
        <div class="cell" onclick="handleCellClick(1)"></div>
        <div class="cell" onclick="handleCellClick(2)"></div>
        <div class="cell" onclick="handleCellClick(3)"></div>
        <div class="cell" onclick="handleCellClick(4)"></div>
        <div class="cell" onclick="handleCellClick(5)"></div>
        <div class="cell" onclick="handleCellClick(6)"></div>
        <div class="cell" onclick="handleCellClick(7)"></div>
        <div class="cell" onclick="handleCellClick(8)"></div>
    </div>
</div>

<script>
    // ΠΡΟΣΟΧΗ: Αν το κλειδί σου έχει ακυρωθεί από το Ably, βάλε ένα νέο εδώ
    const ABLY_KEY = 'lvPZVg.F1b5GQ:VsS4kw48H7emnvy3udA7PmfmEuLU4UjLU24wi_kZt8M';
    
    let ably, channel, mySymbol = null, currentPlayer = 'X', boardState = Array(9).fill(null);

    function startApp() {
        // Έλεγχος αν φορτώθηκε η βιβλιοθήκη από το Cloudflare
        if (typeof Ably === 'undefined') {
            document.getElementById('status').innerText = "Σφάλμα: Η βιβλιοθήκη Ably μπλοκάρεται ακόμα. Δοκίμασε Incognito mode.";
            document.getElementById('status').className = "error";
            return;
        }

        const room = document.getElementById('roomInput').value.trim();
        if (!room) return alert("Δώσε όνομα δωματίου!");

        document.getElementById('status').innerText = "Σύνδεση...";

        // Σύνδεση
        ably = new Ably.Realtime({ key: ABLY_KEY });

        ably.connection.on('connected', () => {
            document.getElementById('status').innerText = "Συνδέθηκε! Περιμένω κίνηση...";
            document.getElementById('setup').style.display = 'none';
            document.getElementById('gameBoard').style.display = 'grid';
            
            channel = ably.channels.get(room);
            channel.subscribe('move', (msg) => {
                processMove(msg.data.index, msg.data.symbol);
            });
        });

        ably.connection.on('failed', (err) => {
            document.getElementById('status').innerText = "Σφάλμα Key: " + err.message;
            document.getElementById('status').className = "error";
        });
    }

    function handleCellClick(index) {
        if (boardState[index] || (mySymbol && mySymbol !== currentPlayer)) return;
        if (!mySymbol) mySymbol = currentPlayer;
        channel.publish('move', { index, symbol: mySymbol });
    }

    function processMove(index, symbol) {
        if (boardState[index]) return;
        const cells = document.querySelectorAll('.cell');
        cells[index].innerText = symbol;
        boardState[index] = symbol;
        currentPlayer = (symbol === 'X') ? 'O' : 'X';
        updateUI();
        checkWinner();
    }

    function updateUI() {
        document.getElementById('status').innerText = `Σειρά: ${currentPlayer} | Είσαι: ${mySymbol || '?'}`;
    }

    function checkWinner() {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let combo of wins) {
            const [a, b, c] = combo;
            if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                document.getElementById('status').innerText = "🎉 ΝΙΚΗΤΗΣ: " + boardState[a];
                document.getElementById('gameBoard').style.pointerEvents = 'none';
            }
        }
    }
</script>
</body>
</html>
