<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon P2P Tic-Tac-Toe</title>
    <!-- [PeerJS Library](https://peerjs.com) is essential for P2P connection -->
    <script src="https://unpkg.com"></script>
    <style>
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --x: #f43f5e; --o: #38bdf8; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1e293b, var(--bg)); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .container { background: var(--card); backdrop-filter: blur(12px); padding: 2rem; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 320px; }
        .setup-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 20px; font-size: 0.9rem; }
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 12px; margin: 20px auto; }
        .cell { width: 90px; height: 90px; background: rgba(15, 23, 42, 0.5); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .cell:hover:not(.taken) { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        .cell.x { color: var(--x); text-shadow: 0 0 15px var(--x); }
        .cell.o { color: var(--o); text-shadow: 0 0 15px var(--o); }
        #status { font-size: 1.1rem; margin-bottom: 15px; color: #94a3b8; min-height: 1.5em; }
        input { padding: 10px; border-radius: 8px; border: none; background: #334155; color: white; width: 60%; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--o); color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { transform: scale(1.05); }
        .id-display { color: var(--o); font-weight: bold; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Τρίλιζα <span style="color:var(--o)">Online</span></h1>

    <div class="container">
        <div id="status">Connecting to network...</div>

        <div class="setup-box" id="setup">
            <div>Your ID: <span id="my-id" class="id-display" onclick="copyID()">Generating...</span></div>
            <p style="font-size: 0.7rem; color: #64748b;">(Click ID to copy, send to friend)</p>
            <input type="text" id="peer-id" placeholder="Paste Friend's ID">
            <button onclick="connectToFriend()">Σύνδεση</button>
        </div>

        <div class="board" id="board">
            <div class="cell" onclick="handleTap(0)" id="c0"></div>
            <div class="cell" onclick="handleTap(1)" id="c1"></div>
            <div class="cell" onclick="handleTap(2)" id="c2"></div>
            <div class="cell" onclick="handleTap(3)" id="c3"></div>
            <div class="cell" onclick="handleTap(4)" id="c4"></div>
            <div class="cell" onclick="handleTap(5)" id="c5"></div>
            <div class="cell" onclick="handleTap(6)" id="c6"></div>
            <div class="cell" onclick="handleTap(7)" id="c7"></div>
            <div class="cell" onclick="handleTap(8)" id="c8"></div>
        </div>

        <button onclick="location.reload()" style="background:#475569; color:white; font-size: 0.8rem;">Επανεκκίνηση</button>
    </div>

    <script>
        // Use [Google's STUN servers](url) to bypass firewalls
        const peer = new Peer({
            config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
        });

        let conn, mySym, turn = 'X', board = Array(9).fill(null);

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('status').innerText = "Ready. Share ID to play.";
        });

        // Receiving connection
        peer.on('connection', c => {
            conn = c; mySym = 'X'; 
            initGame();
            document.getElementById('status').innerText = "Connected! You are X (Start)";
        });

        // Initiating connection
        function connectToFriend() {
            const friendId = document.getElementById('peer-id').value;
            if(!friendId) return;
            conn = peer.connect(friendId);
            mySym = 'O';
            initGame();
            document.getElementById('status').innerText = "Connecting...";
        }

        function initGame() {
            document.getElementById('setup').style.display = 'none';
            conn.on('open', () => {
                if(mySym === 'O') document.getElementById('status').innerText = "Connected! Wait for X...";
            });
            conn.on('data', data => {
                if (data.type === 'MOVE') update(data.idx, data.sym);
            });
        }

        function handleTap(idx) {
            if (!conn || board[idx] || turn !== mySym) return;
            update(idx, mySym);
            conn.send({ type: 'MOVE', idx: idx, sym: mySym });
        }

        function update(idx, sym) {
            board[idx] = sym;
            const el = document.getElementById('c' + idx);
            el.innerText = sym;
            el.classList.add(sym.toLowerCase(), 'taken');
            turn = (sym === 'X') ? 'O' : 'X';
            checkWin();
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let [a,b,c] of wins) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById('status').innerText = "Winner: " + board[a] + "! 🎉";
                    conn = null; return;
                }
            }
            if (!board.includes(null)) document.getElementById('status').innerText = "Draw! 🤝";
            else document.getElementById('status').innerText = (turn === mySym ? "Your Turn!" : "Opponent's Turn...");
        }

        function copyID() {
            const idText = document.getElementById('my-id').innerText;
            navigator.clipboard.writeText(idText);
            alert("ID copied: " + idText);
        }
    </script>
</body>
</html>
