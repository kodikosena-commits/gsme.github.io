<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe Online (Ably)</title>
    <script src="https://cdn.ably.com"></script>
    <style>
        :root { --bg: #0f172a; --x: #f43f5e; --o: #38bdf8; }
        body { font-family: sans-serif; background: var(--bg); color: white; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 90px; height: 90px; background: #1e293b; border-radius: 12px; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #status { margin: 20px; color: var(--o); font-weight: bold; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px; background: var(--o); border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Online Τρίλιζα</h1>
    
    <div>
        <input type="text" id="room" placeholder="Όνομα Δωματίου">
        <button onclick="join()">Σύνδεση</button>
    </div>

    <div id="status">Δώσε όνομα δωματίου για να παίξεις</div>

    <div class="grid">
        <div class="cell" onclick="play(0)" id="c0"></div>
        <div class="cell" onclick="play(1)" id="c1"></div>
        <div class="cell" onclick="play(2)" id="c2"></div>
        <div class="cell" onclick="play(3)" id="c3"></div>
        <div class="cell" onclick="play(4)" id="c4"></div>
        <div class="cell" onclick="play(5)" id="c5"></div>
        <div class="cell" onclick="play(6)" id="c6"></div>
        <div class="cell" onclick="play(7)" id="c7"></div>
        <div class="cell" onclick="play(8)" id="c8"></div>
    </div>

    <script>
        // ΠΡΟΣΟΧΗ: Βάλε το δικό σου API KEY από το Ably dashboard εδώ:
        const API_KEY = 'ΤΟ_ΔΙΚΟ_ΣΟΥ_API_KEY_ΕΔΩ'; 
        
        const ably = new Ably.Realtime(API_KEY);
        let channel, mySym = null, board = Array(9).fill(null);

        function join() {
            const roomName = document.getElementById('room').value;
            if(!roomName) return alert("Βάλε όνομα!");
            
            channel = ably.channels.get(roomName);
            document.getElementById('status').innerText = "Συνδέθηκες στο: " + roomName;

            channel.subscribe('move', (msg) => {
                updateUI(msg.data.index, msg.data.symbol);
            });
        }

        function play(i) {
            if(!channel || board[i]) return;
            if(!mySym) mySym = board.filter(x => x !== null).length === 0 ? 'X' : 'O';
            
            channel.publish('move', { index: i, symbol: mySym });
        }

        function updateUI(i, sym) {
            board[i] = sym;
            const el = document.getElementById('c' + i);
            el.innerText = sym;
            el.style.color = (sym === 'X') ? '#f43f5e' : '#38bdf8';
            checkWin();
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let [a,b,c] of wins) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById('status').innerText = "ΝΙΚΗΤΗΣ: " + board[a];
                }
            }
        }
    </script>
</body>
</html>
